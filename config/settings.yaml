# ============================================
# 个人任务助理 —— 本地运行配置（M1）
# 说明：本文件可提交；任何密钥都不要写在这里
# ============================================

# 数据同步
sync:
  # 自动轮询飞书多维表格的间隔（秒），建议 30~60，避免触发 API 限流
  interval_seconds: 45
  # 单次 HTTP 请求超时（秒）
  request_timeout_seconds: 10

# 勿扰时段（24 小时制，支持跨午夜，如 23:00 -> 07:00）
# 该时段内不弹通知、不发语音（飞书 App 自身的自动化推送不受本配置控制）
do_not_disturb:
  start: "23:00"
  end: "07:00"

# 提醒设置
reminder:
  # 提醒引擎检查间隔（秒）
  check_interval_seconds: 30
  # 错过提醒的补发窗口（分钟）：超过该窗口的历史提醒不再补发，避免开机即轰炸
  missed_window_minutes: 60
  # 当任务未配置“提醒规则”时使用的默认提前量
  default_offsets:
    - "提前1天"
    - "提前2小时"
    - "提前10分钟"
  # 语音（TTS）设置
  tts:
    # M1 仅实现 pyttsx3（离线、无需联网）；edge-tts 后续阶段支持
    engine: pyttsx3
    # 语速（pyttsx3 默认约 200）
    rate: 180

# AI 设置（M3；Key 在 config/.env 的 DEEPSEEK_API_KEY，不写在这里）
ai:
  # 置信度阈值：AI 解析置信度低于该值时写入「收集箱」待人工确认，不自动定优先级
  confidence_threshold: 0.6
  # 单次 AI 请求超时（秒）
  timeout_seconds: 60

# 娱乐监督设置（M4）
# 纯规则驱动，无 AI；5 秒采样前台窗口与扩展上报的域名
monitor:
  # 总开关：false 时监控引擎不启动
  enabled: true
  # 采样间隔（秒），项目约定不低于 5 秒
  sample_interval_seconds: 5
  # 容忍窗口（秒）：短暂切走（查资料/回消息）不结束会话，
  # 窗口内切回继续累计、不重复写日志；0 表示关闭容忍（切走即结束）
  grace_seconds: 60
  # 进程/窗口标题白名单（命中则不视为娱乐，不计时）；白名单优先于黑名单
  whitelist_titles: ["Word", "Excel", "PowerPoint", "PyCharm", "Visual Studio", "Code"]
  # 域名白名单（扩展上报的域名命中则豁免）
  whitelist_domains: ["feishu.cn", "github.com", "cnki.net", "scholar.google.com"]
  # 娱乐黑名单：只有显式命中以下任一维度才计入娱乐时长。
  # 三个列表都为空时监督不生效（避免任何窗口都被误判为娱乐）。
  blacklist_domains: ["douyin.com", "bilibili.com", "tiktok.com", "youtube.com", "weibo.com", "zhihu.com", "xiaohongshu.com", "iqiyi.com", "youku.com", "twitch.tv"]
  blacklist_keywords: ["抖音", "哔哩哔哩", "bilibili", "爱奇艺", "腾讯视频", "优酷", "小红书", "微博", "游戏"]
  blacklist_processes: ["douyin.exe", "云·原神.exe", "yuanshen.exe", "steam.exe"]
  # 升级阈值（分钟）：连续娱乐达到该时长依次触发 L1/L2/L3/L4
  escalation:
    l1_minutes: 10   # 系统通知
    l2_minutes: 20   # TTS 语音
    l3_minutes: 30   # 再次系统通知 + 日志备注
    l4_minutes: 45   # 全屏遮挡 / 强制关闭网页
  # L4 触发时执行的动作：overlay=全屏遮罩 | kill_tab=强制关闭网页
  l4_action: "overlay"
  # 暂停提醒期间是否同时暂停监督（与托盘「暂停提醒」联动）
  pause_with_reminder: true
  # 本地 API 端口（接收浏览器扩展上报与关标签页指令）
  local_api_port: 8765
